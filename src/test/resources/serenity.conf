serenity.test.root=serenityswag

webdriver {
  driver = chrome
  //driver = firefox
  autodownload = false
}

drivers {
  windows{
    webdriver.chrome.driver = "src/test/resources/drivers/windows/chromedriver.exe"
  }
  linux{
    webdriver.chrome.driver = "src/test/resources/drivers/linux/chromedriver"
  }
  mac{}
}

chrome {
  switches = """--window-size=800, 600; --no-sandbox; --ignore-certificate-errors; --disable-default-apps;
                --disable-popup-blocking; --disable-extensions-file-access-check; --incognito;
                --disable-dev-shm-usage; --disable-infobars; --disable-gpu"""

  preferences {
    download {
      prompt_for_download = false
      default_directory = "$TEMPDIR"
    }
  }
}

webdriver {
  timeouts {
    implicit.wait = 500
  }
}

headless.mode=false

base.url = "http://demo.seleniumeasy.com"

pages {
  SingleInputFieldForm = "#{base.url}/basic-first-form-demo.html"
  TwoInputFieldForm = "#{base.url}/basic-first-form-demo.html"
  CheckboxForm = "#{base.url}/basic-checkbox-demo.html"
  ModalDialogPage = "#{base.url}/bootstrap-modal-demo.html"
}
